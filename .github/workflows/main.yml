name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project PassionfruitPlayer.xcodeproj -scheme PassionfruitPlayer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PassionfruitPlayer.app Payload/
          zip -r PassionfruitPlayer.ipa Payload
          - uses: actions/upload-artifact@v4
        with:
          name: PassionfruitPlayer-ipa
          path: PassionfruitPlayer.ipa
